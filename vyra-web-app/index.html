<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6C47FF">
<meta name="color-scheme" content="light">
<meta name="description" content="VYRA: track calories and nutrition, plan your diet and workouts, and log your day.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20width%3D%2248%22%20height%3D%2248%22%20viewBox%3D%220%200%2048%2048%22%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22vgf%22%20x1%3D%226%22%20y1%3D%224%22%20x2%3D%2244%22%20y2%3D%2246%22%20gradientUnits%3D%22userSpaceOnUse%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%237A52FF%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23FF5C9A%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%2248%22%20height%3D%2248%22%20rx%3D%2215%22%20fill%3D%22url%28%23vgf%29%22/%3E%3Cpath%20d%3D%22M12%2013.5%2024%2035%2034.6%2016.2%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%226.4%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3Ccircle%20cx%3D%2236.6%22%20cy%3D%2212%22%20r%3D%224.4%22%20fill%3D%22%23C8FF3D%22/%3E%3C/svg%3E">
<title>VYRA – food, diet and workout tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#FAF7FF; --surface:#FFFFFF; --ink:#1F1A4D; --muted:#675F8F; --line:#E8E2F7;
  --brand:#6C47FF; --on-brand:#FFFFFF; --soft:#EDE8FF; --focus:#4B2BD6;
  --lime:#C8FF3D; --sun:#FFD84D; --sun-ink:#2A2100;
  --protein:#FF5C7A; --carbs:#2D9CFF; --fat:#FFB800; --fiber:#2BC48A; --water:#22C7F2;
  --danger:#D6244A;
  --hero-bg:#6C47FF; --hero-ink:#FFFFFF; --hero-track:rgba(255,255,255,.25); --hero-over:#FFB3C1;
  --head:'Outfit','DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.15;letter-spacing:-.01em}
h1{font-size:30px}
h2{font-size:20px}
h3{font-size:18px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.note{color:var(--muted);font-size:14px;margin:12px 0 0}

/* shell */
.top{max-width:1040px;margin:0 auto;padding:14px 16px 6px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:11px;font:800 26px var(--head);letter-spacing:.07em;color:var(--ink)}
.brand-mark{width:40px;height:40px;display:block;line-height:0;filter:drop-shadow(0 3px 0 rgba(31,26,77,.16))}
.brand-mark svg{display:block}
main{max-width:1040px;margin:0 auto;padding:8px 16px 120px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--muted);font-weight:700;font-size:12px;padding:4px;border-radius:14px;cursor:pointer}
.tabs .ic{width:46px;height:28px;border-radius:14px;display:grid;place-items:center}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] .ic{background:var(--brand);color:var(--on-brand)}
@media (min-width:1000px){
  main{padding-bottom:48px}
  .tabs{position:static;border:0;background:none;padding:0;gap:6px;flex:none}
  .tabs button{flex:none;flex-direction:row;gap:8px;padding:8px 16px 8px 12px;font-size:15px;border-radius:999px}
  .tabs .ic{width:auto;height:auto;background:none!important;color:inherit!important}
  .tabs button[aria-current="page"]{background:var(--brand);color:#fff}
}

/* layout helpers */
.split{display:grid;gap:16px}
.stack{display:grid;gap:16px;align-content:start}
@media (min-width:900px){.split{grid-template-columns:minmax(320px,390px) 1fr;align-items:start}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}
.page-title{margin:8px 0 16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* buttons, inputs */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:transparent;color:var(--on-brand)}
.btn.primary:hover{filter:brightness(.95)}
.btn.small{padding:7px 14px;font-size:14px}
.btn.wide{width:100%}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;font-size:20px;line-height:1}
.input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
select.input{appearance:auto}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:15px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.field{display:grid;gap:8px;margin-bottom:16px}
.field>span{font-weight:700;font-size:14px;color:var(--muted)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.form h2{margin-bottom:14px}

/* date bar */
.datebar{display:flex;align-items:center;gap:10px;margin:8px 0 16px}
.datebar .grow{flex:1;min-width:0}
.datebar small{display:block;color:var(--muted);font-size:14px;margin-top:2px}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--hero-bg);color:var(--hero-ink);border-radius:28px;padding:20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
.hero::before{content:'';position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero::after{content:'';position:absolute;left:-30px;bottom:-40px;width:110px;height:110px;border-radius:50%;background:rgba(200,255,61,.22)}
.hero>*{position:relative;z-index:1}
.mood{flex-basis:100%;margin:0;text-align:center;font-weight:700;font-size:15px;background:rgba(255,255,255,.16);border-radius:999px;padding:8px 14px}
.ring{width:160px;height:160px;flex:none}
.ring-n{font:700 44px var(--head);fill:var(--hero-ink)}
.ring-l{font:500 14px var(--body);fill:var(--hero-ink)}
.stats{margin:0;display:grid;gap:10px;flex:1;min-width:120px}
.stats div{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:1px solid rgba(255,255,255,.3);padding-bottom:6px}
.stats dt{font-size:14px}
.stats dd{margin:0;font:700 22px var(--head)}

/* macros */
.macro{margin-bottom:14px}
.macro:last-child{margin-bottom:0}
.mrow{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.mname{display:flex;align-items:center;gap:8px;font-weight:700}
.mname i{width:10px;height:10px;border-radius:50%;display:inline-block}
.track{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.track span{display:block;height:100%;border-radius:99px;min-width:0}
.water{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper .icon-btn{width:36px;height:36px;font-size:18px}

/* quote */
.quote{background:var(--sun);color:var(--sun-ink);border:2px solid var(--sun-ink);box-shadow:5px 5px 0 var(--sun-ink);border-radius:22px;padding:16px 18px;margin:0 5px 20px 0;display:flex;gap:12px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.q-text{margin:0;font:700 20px/1.3 var(--head);flex:1 1 260px}
.q-next{background:var(--sun-ink);color:var(--sun);border:0;border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer}
.q-next:hover{filter:brightness(1.3)}
.m-Breakfast{border-left:6px solid var(--fat)}
.m-Lunch{border-left:6px solid var(--protein)}
.m-Dinner{border-left:6px solid var(--brand)}
.m-Snacks{border-left:6px solid var(--fiber)}

/* meals */
.meal-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.meal-h h3{flex:1}
.meal-h .muted{font-size:14px}
.entries,.plan-items,.ex-list{list-style:none;margin:0;padding:0}
.entries li{display:flex;align-items:center;gap:4px;border-top:1px solid var(--line)}
.entry{flex:1;min-width:0;display:flex;justify-content:space-between;align-items:center;gap:12px;background:none;border:0;padding:12px 0;text-align:left;cursor:pointer}
.en-main{display:grid;min-width:0}
.en-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.en-sub{font-size:14px;color:var(--muted)}
.en-k{font-weight:700;white-space:nowrap}
.x{width:34px;height:34px;border-radius:50%;border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer}
.x:hover{background:var(--line)}
.empty{color:var(--muted);margin:4px 0 2px;font-size:15px}
.grid-meals{display:grid;gap:16px}

/* diet */
.plan-items li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.plan-items small{display:block;color:var(--muted);font-size:14px}
.plan-items b{white-space:nowrap}
.meal-card .row{margin-top:10px}

/* train */
.day summary{cursor:pointer;display:grid;gap:2px;list-style:none}
.day summary::-webkit-details-marker{display:none}
.day-t{font:700 20px var(--head)}
.day-s{color:var(--muted);font-size:15px}
.day[open] summary{margin-bottom:10px}
.ex-list li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ex-list li span:last-child{color:var(--muted);white-space:nowrap}
.day .btn{margin-top:12px}
.sess-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.timer{font:700 34px var(--head);font-variant-numeric:tabular-nums}
.sess-ex{margin-bottom:12px}
.sess-ex header{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.sess-ex .rx{color:var(--muted);font-size:15px}
.sets{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.set{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font:700 16px var(--head);cursor:pointer}
.set[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.wt{width:92px;margin-left:auto;padding:10px 12px}
.hist li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.hist{list-style:none;margin:0;padding:0}
.hist small{color:var(--muted);display:block}

/* profile */
.tgt-kcal{font:700 44px var(--head);margin:6px 0 12px}
.tgt-kcal small{font:500 18px var(--body);color:var(--muted)}
.tgt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tgt-grid div{border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.tgt-grid span{display:block;color:var(--muted);font-size:14px}
.tgt-grid b{font:700 20px var(--head)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--soft);border-radius:16px;padding:12px 16px;margin-bottom:16px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:none}
.sheet.open{display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(10,20,35,.5)}
.panel{position:relative;background:var(--surface);width:100%;max-width:560px;max-height:90vh;max-height:90dvh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:rise .22s ease-out;outline:none}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (min-width:1000px){.sheet.open{align-items:center}.panel{border-radius:24px}}
.p-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.p-head h2{flex:1;min-width:0}
.panel .seg{margin-bottom:12px}
.results{margin-top:12px}
.res-h{font-size:14px;font-weight:700;color:var(--muted);margin:14px 0 4px}
.res{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;background:none;border:0;border-top:1px solid var(--line);padding:11px 0;text-align:left;cursor:pointer}
.res span:first-child{display:grid;min-width:0}
.res small{color:var(--muted);font-size:14px}
.res-k{font-weight:700;white-space:nowrap}
.link{background:none;border:0;color:var(--focus);font-weight:700;cursor:pointer;padding:12px 0;text-decoration:underline}
.qty{display:flex;align-items:center;gap:10px;margin:12px 0}
.qty .input{width:92px;text-align:center}
.preview{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 16px}
.preview div{border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.preview b{display:block;font:700 20px var(--head)}
.preview span{font-size:13px;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid .full{grid-column:1/-1}

/* auth + user chip */
.userchip{display:flex;align-items:center;gap:10px;font-weight:700;min-width:0}
.u-name{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body:not(.authed) .tabs{display:none}
body:not(.authed) main{padding-bottom:40px}
.auth{display:grid;place-items:center;padding:8px 0 40px}
.auth-card{width:100%;max-width:430px;padding:26px 24px}
.auth-logo{margin-bottom:16px;display:flex;align-items:center;gap:12px;line-height:1;font:800 26px var(--head);letter-spacing:.07em}
body:not(.authed) .brand{display:none}
.auth-card h1{font-size:28px}
.auth-card .seg{margin-bottom:18px}
.pw{display:flex;gap:8px}
.pw .input{flex:1;min-width:0}
.auth-err{color:var(--danger);font-weight:700;min-height:1.4em;margin:0 0 10px;font-size:14px}
.btn:focus-within{outline:3px solid var(--focus);outline-offset:2px}
label.btn{display:inline-block}
.warn{background:#FFF1D6;border:1px solid #FFD27A;color:#5B3A00;border-radius:14px;padding:10px 14px;margin-bottom:14px;font-size:14px}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:999px;font-weight:700;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
@media (min-width:1000px){#toast{bottom:28px}}
@media (prefers-reduced-motion: reduce){.panel{animation:none}#toast{transition:none}}
/* ===== aesthetic layer: ambient glow, glass, motion ===== */
html{scroll-behavior:smooth}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(520px 380px at 92% -4%,rgba(255,92,154,.20),transparent 62%),
  radial-gradient(560px 420px at -6% 16%,rgba(108,71,255,.17),transparent 62%),
  radial-gradient(520px 380px at 78% 104%,rgba(200,255,61,.26),transparent 62%)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes sheetIn{from{opacity:0;transform:translateY(40px) scale(.98)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-14px,10px)}}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
#view.enter>:not(.split),#view.enter .split>.card,#view.enter .split>.stack>*,#view.enter .split>.grid-meals>*{animation:fadeUp .65s cubic-bezier(.2,.75,.2,1) backwards}

.card{border-color:rgba(108,71,255,.10);box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 14px 34px -18px rgba(31,26,77,.22);transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s}
.card.meal:hover,.meal-card:hover,.day:hover{transform:translateY(-3px);box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 22px 42px -18px rgba(108,71,255,.34)}
.hero{background:linear-gradient(135deg,#6C47FF 0%,#8B4BFF 48%,#FF5C9A 125%);box-shadow:0 26px 52px -24px rgba(108,71,255,.7)}
.hero::before{animation:drift 9s ease-in-out infinite}
.hero::after{animation:drift 11s ease-in-out infinite reverse}
.datebar h1,.page-title,.auth-card h1{background:linear-gradient(90deg,var(--ink) 0%,var(--brand) 70%,#FF5C9A 130%);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}

.btn,.chip,.icon-btn,.set,.q-next,.tabs button{transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .25s,background-color .2s,border-color .2s,color .2s,filter .2s}
.btn:hover,.chip:hover,.icon-btn:hover{transform:translateY(-1px)}
.btn:active,.chip:active,.icon-btn:active,.set:active,.q-next:active{transform:scale(.96)}
.btn.primary{box-shadow:0 10px 22px -10px rgba(108,71,255,.75)}
.btn.primary:hover{box-shadow:0 14px 26px -10px rgba(108,71,255,.85)}
.chip[aria-pressed="true"]{box-shadow:0 8px 18px -8px rgba(108,71,255,.7)}
.set[aria-pressed="true"]{box-shadow:0 8px 16px -8px rgba(108,71,255,.7)}
.brand-mark svg{transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.brand-mark:hover svg{transform:rotate(-8deg) scale(1.06)}
.entry .en-name{transition:color .2s}
.entry:hover .en-name{color:var(--brand)}

.tabs .ic{transition:background-color .3s,color .3s,transform .3s cubic-bezier(.2,.8,.2,1)}
.tabs button[aria-current="page"] .ic{animation:pop .45s}
@media (max-width:999px){.tabs{background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top-color:rgba(108,71,255,.12);box-shadow:0 -10px 30px -16px rgba(31,26,77,.25)}}
@media (min-width:1000px){.tabs button[aria-current="page"]{box-shadow:0 10px 22px -10px rgba(108,71,255,.7)}}

.track span{transition:width .9s cubic-bezier(.22,.8,.2,1);box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.hero circle[data-dash]{transition:stroke-dasharray 1s cubic-bezier(.22,.8,.2,1),opacity .3s}

.quote{transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.quote:hover{transform:translate(-2px,-2px) rotate(-.4deg);box-shadow:7px 7px 0 var(--sun-ink)}
.q-text{transition:opacity .18s,transform .18s}
.q-text.out{opacity:0;transform:translateY(-8px)}
.q-text.in{animation:fadeUp .45s cubic-bezier(.2,.75,.2,1) backwards}

.auth-card{background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 30px 60px -30px rgba(108,71,255,.45)}
.auth-logo svg{animation:floaty 4.5s ease-in-out infinite}

.sheet.open .scrim{animation:fadeIn .25s both}
.panel{animation:sheetIn .38s cubic-bezier(.2,.9,.3,1.05) both}
#toast{transform:translate(-50%,16px) scale(.96);transition:opacity .3s,transform .35s cubic-bezier(.2,.9,.3,1.2)}
#toast.show{transform:translate(-50%,0) scale(1)}
.card.m-Breakfast{border-left-color:var(--fat)}
.card.m-Lunch{border-left-color:var(--protein)}
.card.m-Dinner{border-left-color:var(--brand)}
.card.m-Snacks{border-left-color:var(--fiber)}

/* ===== pro, insights, admin, cloud auth ===== */
[hidden]{display:none!important}
.pro-badge{background:linear-gradient(135deg,#FFB300,#FF5C9A);color:#fff;font:800 11px var(--head);letter-spacing:.08em;padding:5px 10px;border-radius:999px}
.sync{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.sync.error{color:var(--danger)}
@media (max-width:480px){.u-name,.sync{display:none}.userchip{gap:8px}}
.stat-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:1000px){.stat-cards.four{grid-template-columns:repeat(4,1fr)}}
.stat{border:1px solid rgba(108,71,255,.12);border-radius:18px;padding:14px 16px;background:var(--surface)}
.stat b{display:block;font:800 24px var(--head)}
.stat span{color:var(--muted);font-size:14px}
.chart{width:100%;height:auto;display:block}
.chart text{font:12px var(--body);fill:var(--muted)}
.chart rect{transform-box:fill-box;transform-origin:bottom;animation:growY .7s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes growY{from{transform:scaleY(0)}}
.lock{text-align:center;padding:28px 18px}
.lock .preview{opacity:.45;max-width:100%;height:auto}
.lock h2{margin:10px 0 6px}
.pro-list{margin:0 0 16px;padding-left:20px}
.pro-list li{margin-bottom:6px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:14px 0}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--line)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px}
.adm-row{display:grid;gap:6px;padding:14px 0;border-top:1px solid var(--line)}
.adm-row:first-child{border-top:0}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.badge.free{background:var(--soft);color:var(--focus)}
.badge.pro{background:#FFF1D6;color:#8A5A00}
.badge.pend{background:#FFE0E6;color:var(--danger)}
.adm-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.adm-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.adm-tools .input{flex:1;min-width:180px}
.userchip{flex:none}
.userchip .btn,.pro-badge{white-space:nowrap}
@media (max-width:1360px){.u-name,.sync{display:none}}
@media (min-width:1000px){.tabs button{padding:8px 11px 8px 9px;font-size:14px;gap:6px}.top{max-width:1100px}}

// Loads Firebase only when firebase-config.js has real values. Otherwise VYRA runs in local mode.
window.VYRA_FB_READY=(async()=>{
  const C=(window.VYRA_CONFIG||{}).firebase;
  if(!C||!C.apiKey||/PASTE|YOUR_/i.test(C.apiKey))return null;
  try{
    const base='https://www.gstatic.com/firebasejs/10.12.2/';
    const [appM,authM,fsM]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
    const app=appM.initializeApp(C);
    return {authM:authM,fsM:fsM,auth:authM.getAuth(app),db:fsM.getFirestore(app)};
  }catch(e){console.error('Firebase could not load',e);window.VYRA_FB_FAILED=true;return null;}
})();

const b64=a=>btoa(String.fromCharCode.apply(null,Array.from(a)));
const unb64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
function newSalt(){const a=new Uint8Array(16);if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);else for(let i=0;i<16;i++)a[i]=Math.floor(Math.random()*256);return b64(a);}
async function hashPw(pw,salt,it){
  try{
    if(window.crypto&&crypto.subtle){
      const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
      const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:unb64(salt),iterations:it||120000,hash:'SHA-256'},key,256);
      return 'p1:'+b64(new Uint8Array(bits));
    }
  }catch(e){}
  let h1=0xdeadbeef,h2=0x41c6ce57;const str=salt+pw;
  for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return 'p0:'+(4294967296*(2097151&h2)+(h1>>>0)).toString(36);
}

function targets(){
  const P=state.profile;
  const bmr=10*P.weight+6.25*P.height-5*P.age+(P.sex==='male'?5:-161);
  const tdee=bmr*P.activity;
  const adj={lose:-500,maintain:0,gain:300}[P.goal]||0;
  const floor=P.sex==='male'?1500:1200;
  const kcal=Math.max(floor,Math.round((tdee+adj)/10)*10);
  const p=Math.round(P.weight*({lose:2.0,maintain:1.6,gain:1.8}[P.goal]||1.6));
  const f=Math.round(kcal*.25/9);
  const c=Math.max(50,Math.round((kcal-p*4-f*9)/4));
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),adj:adj,kcal:kcal,p:p,c:c,f:f,fib:Math.round(kcal/1000*14)};
}

/* ---------- diet generator ---------- */
function pickMeal(m,T,tier,avoid){
  let idx=[];
  TPL[m].forEach((x,i)=>{if(x.t<=tier&&i!==avoid)idx.push(i);});
  if(!idx.length)TPL[m].forEach((x,i)=>{if(x.t<=tier)idx.push(i);});
  const ti=idx[Math.floor(Math.random()*idx.length)];
  const tpl=TPL[m][ti];
  const base=tpl.i.reduce((s,a)=>s+FBY[a[0]].kcal*a[1],0);
  const k=clamp(T.kcal*SHARE[m]/base,.5,2.2);
  return {ti:ti,items:tpl.i.map(a=>({id:a[0],q:roundQ(a[0],a[1]*k)}))};
}
function genDiet(T){
  const tier=TIER[state.profile.diet];
  const cands=[];
  for(let n=0;n<40;n++){
    const meals={};let kcal=0,p=0;
    MEALS.forEach(m=>{
      const pm=pickMeal(m,T,tier,-1);meals[m]=pm;
      const t=itemsTotal(pm.items);kcal+=t.kcal;p+=t.p;
    });
    cands.push({meals:meals,score:Math.abs(kcal-T.kcal)+Math.max(0,T.p-p)*6});
  }
  cands.sort((a,b)=>a.score-b.score);
  return cands[Math.floor(Math.random()*3)].meals;
}
function ensureDiet(T){
  const sig=T.kcal+'|'+state.profile.diet+'|'+T.p;
  if(!state.diet||state.diet.sig!==sig){state.diet={sig:sig,meals:genDiet(T)};save();}
}

/* ---------- workout plan generator ---------- */
function mkEx(x,comp,pp){
  const adv=pp.level==='intermediate';
  let reps;
  if(x[2])reps=adv?'45–60 s':'30–45 s';
  else if(pp.goal==='fatloss')reps='12–15';
  else if(pp.goal==='muscle')reps=comp?'8–10':'10–12';
  else reps='10–12';
  const sets=x[2]?3:(comp?(adv?4:3):(adv?3:2));
  return {name:x[0],sets:sets,reps:reps,timed:!!x[2]};
}
function buildPlan(seed){
  const pp=state.planParams,split=SPLITS[pp.days],seen={};
  const days=split.map(type=>{
    const occ=(seen[type]=(seen[type]||0)+1)-1;
    const used={},ex=[];
    DAYS[type].forEach((cat,si)=>{
      const pool=LIB[cat].filter(x=>(pp.place==='gym'?x[1]!=='h':x[1]!=='g')&&!used[x[0]]);
      if(!pool.length)return;
      const pick=pool[(occ*2+seed+si)%pool.length];
      used[pick[0]]=1;
      ex.push(mkEx(pick,COMPOUND.indexOf(cat)>=0,pp));
    });
    if(pp.goal==='fatloss')ex.push({name:'Brisk walk, jog or skipping',sets:1,reps:'10–15 min',cardio:true});
    return {type:type,label:LABEL[type],exercises:ex};
  });
  state.plan={params:Object.assign({},pp),seed:seed,days:days};
}

    '<circle cx="100" cy="100" r="'+R+'" fill="none" stroke="var(--hero-track)" stroke-width="16"/>'+prog+
    '<text x="100" y="102" text-anchor="middle" class="ring-n" data-ck="ring" data-count="'+Math.round(Math.abs(left))+'">'+fmt(Math.abs(left))+'</text>'+

function stat(v,l){return '<div class="stat"><b>'+v+'</b><span>'+l+'</span></div>';}
function lastKeys(n){const o=[];for(let i=n-1;i>=0;i--)o.push(shiftKey(todayKey(),-i));return o;}
function streakDays(){let n=0,k=todayKey();if(!(getDay(k).food||[]).length)k=shiftKey(k,-1);while((getDay(k).food||[]).length){n++;k=shiftKey(k,-1);if(n>3650)break;}return n;}
function barChart(vals,labels,target){
  const W=600,H=240,L=44,R=10,T=22,Bm=34,n=vals.length;
  const mx=Math.max(target*1.25,Math.max.apply(null,vals),10),bw=(W-L-R)/n;
  const y=v=>T+(H-T-Bm)*(1-v/mx);
  let o='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Calories over the last 7 days compared with your goal">';
  [0,.5,1].forEach(f=>{const v=Math.round(mx*f);o+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+fmt(v)+'</text>';});
  vals.forEach((v,i)=>{
    const x=L+i*bw+bw*.18,w=bw*.64,h=(H-T-Bm)*(v/mx),over=v>target*1.05;
    o+='<rect x="'+x+'" y="'+y(v)+'" width="'+w+'" height="'+Math.max(h,0)+'" rx="6" fill="'+(over?'var(--protein)':'var(--brand)')+'"/>';
    if(v>0)o+='<text x="'+(x+w/2)+'" y="'+(y(v)-5)+'" text-anchor="middle">'+fmt(v)+'</text>';
    o+='<text x="'+(x+w/2)+'" y="'+(H-12)+'" text-anchor="middle">'+labels[i]+'</text>';
  });
  o+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(target)+'" y2="'+y(target)+'" stroke="var(--ink)" stroke-dasharray="5 4"/><text x="'+(W-R)+'" y="'+(y(target)-6)+'" text-anchor="end">Goal '+fmt(target)+'</text></svg>';
  return o;
}
function lineChart(pts){
  if(pts.length<2)return '<p class="empty">Log your weight on at least two days to see the trend.</p>';
  const W=600,H=220,L=44,R=14,T=18,Bm=32;
  const kg=pts.map(p=>p.kg),lo=Math.min.apply(null,kg)-1,hi=Math.max.apply(null,kg)+1;
  const x=i=>L+(W-L-R)*(i/(pts.length-1)),y=v=>T+(H-T-Bm)*(1-(v-lo)/(hi-lo));
  let o='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Weight trend">';
  [lo,(lo+hi)/2,hi].forEach(v=>{o+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+v.toFixed(1)+'</text>';});
  o+='<polyline fill="none" stroke="var(--brand)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="'+pts.map((p,i)=>x(i)+','+y(p.kg)).join(' ')+'"/>';
  pts.forEach((p,i)=>{o+='<circle cx="'+x(i)+'" cy="'+y(p.kg)+'" r="4.5" fill="#fff" stroke="var(--brand)" stroke-width="3"/>';});
  const sd=d=>parseKey(d).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  o+='<text x="'+L+'" y="'+(H-8)+'">'+sd(pts[0].date)+'</text><text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end">'+sd(pts[pts.length-1].date)+'</text></svg>';
  return o;
}

/* ---------- motion ---------- */
const REDUCED=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let animateNext=false,qAnim=false,renderedTab=null;
function snapshotUI(){
  const bars={},nums={};
  $$('#view [data-bar]').forEach(e=>{bars[renderedTab+':'+e.dataset.bar]=e.style.width;});
  $$('#view [data-ck]').forEach(e=>{nums[renderedTab+':'+e.dataset.ck]=Number(e.dataset.count);});
  const r=$('#view [data-dash]');
  return {tab:renderedTab,bars:bars,nums:nums,dash:r?r.dataset.dash:null};
}
function countUp(e,from,to){
  const pre=e.dataset.prefix||'';
  if(from===to){e.textContent=pre+fmt(to);return;}
  const t0=performance.now(),dur=850;
  const step=now=>{const k=Math.min(1,(now-t0)/dur),v=from+(to-from)*(1-Math.pow(1-k,3));e.textContent=pre+fmt(v);if(k<1)requestAnimationFrame(step);};
  e.textContent=pre+fmt(from);requestAnimationFrame(step);
}
function motion(prev){
  const view=$('#view');
  if(animateNext&&!REDUCED){
    view.classList.remove('enter');void view.offsetWidth;view.classList.add('enter');
    let i=0;
    $$('#view.enter>:not(.split), #view.enter .split>.card, #view.enter .split>.stack>*, #view.enter .split>.grid-meals>*').forEach(el=>{el.style.animationDelay=(i++*55)+'ms';});
  }else view.classList.remove('enter');
  animateNext=false;
  if(REDUCED){qAnim=false;return;}
  const same=prev.tab===renderedTab;
  $$('#view [data-bar]').forEach(e=>{
    const target=e.style.width,k=renderedTab+':'+e.dataset.bar;
    const from=same&&prev.bars[k]!==undefined?prev.bars[k]:'0%';
    if(from===target)return;
    e.style.width=from;void e.offsetWidth;e.style.width=target;
  });
  const r=$('#view [data-dash]');
  if(r){
    const target=r.dataset.dash,from=same&&prev.dash?prev.dash:'0 '+target.split(' ')[1];
    if(from!==target){r.style.strokeDasharray=from;void r.getBoundingClientRect();r.style.strokeDasharray=target;}
  }
  $$('#view [data-ck]').forEach(e=>{
    const to=Number(e.dataset.count),k=renderedTab+':'+e.dataset.ck;
    countUp(e,same&&prev.nums[k]!==undefined?prev.nums[k]:0,to);
  });
  if(qAnim){const t=$('#view .q-text');if(t)t.classList.add('in');qAnim=false;}
}

  'del-no'(){ui.confirmDel=false;render();},
  'del-yes'(){
    if(cloud.fb){cloudDelete();return;}
    const users=getUsers();delete users[CUR];saveUsers(users);
    store.del(dataKey());
    logout();toast('Account deleted');
  },
  quote(){const t=$('#view .q-text');const go=()=>{ui.qOff=(ui.qOff||0)+1;qAnim=true;render();};if(t&&!REDUCED){t.classList.add('out');setTimeout(go,180);}else go();},
  tab(el){ui.tab=el.dataset.t;ui.confirmReset=false;ui.confirmDel=false;animateNext=true;render();window.scrollTo(0,0);if(ui.tab==='admin'&&cloud.admin&&!cloud.adm.users)adminLoad();},
  'day-prev'(){ui.date=shiftKey(ui.date,-1);animateNext=true;render();},
  'day-next'(){ui.date=shiftKey(ui.date,1);animateNext=true;render();},
  'day-today'(){ui.date=todayKey();animateNext=true;render();},
  water(el){const d=ensureDay(ui.date);d.water=clamp((d.water||0)+Number(el.dataset.d),0,20);save();render();},
  add(el){openSheet({meal:el.dataset.meal});},
  edit(el){
    const e=getDay(ui.date).food.find(x=>x.uid===el.dataset.id);if(!e)return;
    openSheet({mode:'detail',meal:e.meal,editId:e.uid,qty:e.q,food:{name:e.name,serving:e.serving,kcal:e.base.kcal,p:e.base.p,c:e.base.c,f:e.base.f,fib:e.base.fib}});
  },
  remove(el){const d=ensureDay(ui.date);d.food=d.food.filter(x=>x.uid!==el.dataset.id);save();render();toast('Removed');},
  'rm-workout'(el){const d=ensureDay(ui.date);d.workouts=d.workouts.filter(x=>x.uid!==el.dataset.id);save();render();toast('Removed');},
  'close-sheet'(){closeSheet();},
  back(){sheet.mode='search';sheet.food=null;sheet.editId=null;renderSheet();},
  'sheet-meal'(el){sheet.meal=el.dataset.meal;
    if(sheet.mode==='search'){$$('#sheet .chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.meal===sheet.meal));}
    else renderSheet();},
  pick(el){const f=findFood(el.dataset.id);if(!f)return;sheet.food=f;sheet.qty=1;sheet.mode='detail';renderSheet();},
  qty(el){sheet.qty=Math.max(.25,Math.round(((sheet.qty||0)+Number(el.dataset.d))*4)/4);const i=$('#qty');if(i)i.value=fmtQ(sheet.qty);updatePreview();},
  'save-food'(){
    const q=sheet.qty;if(!(q>0)){toast('Enter how many servings');return;}
    const f=sheet.food;
    if(sheet.editId){
      const e=getDay(ui.date).food.find(x=>x.uid===sheet.editId);
      if(e){e.q=q;e.meal=sheet.meal;}
      toast('Changes saved');
    }else{
      addEntry(sheet.meal,f,q);
      if(f.id){state.recent=[f.id].concat(state.recent.filter(x=>x!==f.id)).slice(0,8);}
      toast('Added to '+sheet.meal);
    }
    save();closeSheet();render();
  },
  'remove-open'(){const d=ensureDay(ui.date);d.food=d.food.filter(x=>x.uid!==sheet.editId);save();closeSheet();render();toast('Removed');},
  'custom-food'(){sheet.mode='custom';renderSheet();},
  'save-custom'(){
    const c=sheet.cf,err=$('#cf-err'),n=v=>{const x=parseFloat(v);return isFinite(x)&&x>=0?x:0;};
    if(!c.name.trim()){err.textContent='Give the food a name.';return;}
    if(!(parseFloat(c.kcal)>=0)){err.textContent='Enter the calories for one serving.';return;}
    if(!isPro()&&state.custom.length>=FREE_CUSTOM){err.innerHTML='Free plan allows '+FREE_CUSTOM+' custom foods. <button type="button" class="link" data-act="pro-open" style="padding:0">Upgrade to Pro</button> for unlimited.';return;}
    const f={id:'c'+uid(),name:c.name.trim(),serving:c.serving.trim()||'1 serving',kcal:n(c.kcal),p:n(c.p),c:n(c.c),f:n(c.f),fib:n(c.fib),custom:true,tier:0};
    state.custom.push(f);save();
    sheet.food=f;sheet.qty=1;sheet.mode='detail';renderSheet();
  },
  prof(el){
    const k=el.dataset.k;state.profile[k]=el.dataset.v;state.profile.set=true;
    if(k==='diet')state.diet=null;
    save();render();
  },
  'new-plan'(){state.diet=null;ensureDiet(targets());render();},
  swap(el){const m=el.dataset.meal,tier=TIER[state.profile.diet];state.diet.meals[m]=pickMeal(m,targets(),tier,state.diet.meals[m].ti);save();render();},
  'log-meal'(el){
    const m=el.dataset.meal;state.diet.meals[m].items.forEach(it=>{addEntry(m,FBY[it.id],it.q);});
    save();toast(m+' logged to '+dayLabel(ui.date).toLowerCase());
  },
  'log-day'(){
    MEALS.forEach(m=>state.diet.meals[m].items.forEach(it=>addEntry(m,FBY[it.id],it.q)));
    save();toast('Full day logged to '+dayLabel(ui.date).toLowerCase());
  },
  pp(el){const k=el.dataset.k;state.planParams[k]=k==='days'?Number(el.dataset.v):el.dataset.v;buildPlan(0);save();render();},
  'shuffle-plan'(){buildPlan((state.plan?state.plan.seed:0)+1);save();render();},
  start(el){state.session={day:Number(el.dataset.day),start:Date.now(),sets:{},wt:{}};ui.confirmCancel=false;save();render();window.scrollTo(0,0);},
  set(el){const s=state.session,i=el.dataset.ex,j=Number(el.dataset.i);s.sets[i][j]=!s.sets[i][j];save();render();},
  finish(){
    const s=state.session,day=state.plan.days[s.day];
    const min=Math.max(1,Math.round((Date.now()-s.start)/60000));
    let sets=0;Object.keys(s.sets).forEach(k=>{sets+=s.sets[k].filter(Boolean).length;});
    const kcal=Math.round(5*state.profile.weight*min/60);
    ensureDay(todayKey()).workouts.push({uid:uid(),name:'Day '+(s.day+1)+' · '+day.label,min:min,kcal:kcal,sets:sets});
    state.session=null;ui.confirmCancel=false;save();render();window.scrollTo(0,0);toast('Workout logged');
  },
  cancel(){ui.confirmCancel=true;render();},
  'cancel-no'(){ui.confirmCancel=false;render();},
  'cancel-yes'(){state.session=null;ui.confirmCancel=false;save();render();},
  'log-activity'(){
    const i=Number($('#act-sel').value),min=Math.round(parseFloat($('#act-min').value));
    if(!(min>=1&&min<=600)){toast('Enter minutes between 1 and 600');return;}
    const a=ACTS[i];
    ensureDay(todayKey()).workouts.push({uid:uid(),name:a[0],min:min,kcal:Math.round(a[1]*state.profile.weight*min/60),sets:0});
    save();render();toast(a[0]+' logged');
  },
  reset(){ui.confirmReset=true;render();},
  'reset-no'(){ui.confirmReset=false;render();},
  'reset-yes'(){state=clone(DEFAULT);ui.confirmReset=false;ui.date=todayKey();save();render();toast('All data erased');}
};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const f=ACT[el.dataset.act];if(f)f(el,e);
});
document.addEventListener('input',e=>{
  const t=e.target;if(!t||!t.dataset)return;
  if(t.dataset.bind){
    const k=t.dataset.bind,v=parseFloat(t.value);
    if(isFinite(v)&&LIM[k]&&v>=LIM[k][0]&&v<=LIM[k][1]){
      state.profile[k]=v;state.profile.set=true;state.diet=null;save();
      const box=$('#targets');if(box)box.innerHTML=targetsHTML();
    }
  }else if(t.id==='q'){sheet.q=t.value;const r=$('#results');if(r)r.innerHTML=resultsHTML();}
  else if(t.id==='qty'){sheet.qty=parseFloat(t.value)||0;updatePreview();}
  else if(t.id==='act-min'||t.id==='act-sel'){const p=$('#act-prev');if(p)p.textContent=actPreview(Number($('#act-sel').value),parseFloat($('#act-min').value));}
  else if(t.dataset.wt!==undefined&&state.session){state.session.wt[t.dataset.wt]=t.value;save();}
  else if(t.id==='adm-q'){cloud.adm.q=t.value;const l=$('#adm-list');if(l)l.innerHTML=admRows();}
  else if(t.dataset.cf&&sheet){sheet.cf[t.dataset.cf]=t.value;}
});
document.addEventListener('submit',e=>{if(e.target&&e.target.id==='auth-form'){e.preventDefault();doAuth();}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t&&t.id==='restore-file'&&t.files&&t.files[0]&&state){
    const r=new FileReader();
    r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||typeof o!=='object'||typeof o.log!=='object'||!o.profile)throw new Error('bad');state=merge(o);state.session=null;save();render();toast('Backup restored');}catch(err){toast('That file is not a VYRA backup');}};
    r.readAsText(t.files[0]);t.value='';
  }
});
document.addEventListener('keydown',e=>{
  if(!sheet)return;
  if(e.key==='Escape'){closeSheet();}
  else if(e.key==='Enter'&&e.target&&e.target.id==='q'){const first=$('#results .res');if(first){e.preventDefault();first.click();}}
});

/* session timer */
setInterval(()=>{const t=$('#sess-timer');if(t&&state&&state.session)t.textContent=clock(Date.now()-state.session.start);},1000);

(async function init(){
  await new Promise(r=>{if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',r,{once:true});else r();});
  const fb=await (window.VYRA_FB_READY||Promise.resolve(null));
  if(fb){
    cloud.fb=fb;booting=true;render();
    fb.authM.onAuthStateChanged(fb.auth,user=>{
      if(user){if(CUR!==user.uid||!state)cloudStart(user);}
      else{CUR=null;state=null;cloud.user=null;cloud.meta=null;cloud.admin=false;booting=false;animateNext=true;render();}
    });
    setTimeout(()=>{if(booting){booting=false;render();}},9000);
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')cloudFlush();});
    window.addEventListener('pagehide',()=>{cloudFlush();});
    return;
  }
  let u=store.get(SESSION_KEY);
  if(u&&getUsers()[u]){CUR=u;state=load();}
  animateNext=true;render();
})();
})();
</script>
</body>
</html>
